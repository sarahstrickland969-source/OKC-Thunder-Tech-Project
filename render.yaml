services:
  - type: web
    name: sarah-lineup-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/bootstrap.py && gunicorn app.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: sarah-lineup-db
          property: connectionString
      - key: FRONTEND_HOST
        fromService:
          name: sarah-lineup-web
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  - type: web
    name: sarah-lineup-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && node scripts/set-render-api.cjs && npm run build
    staticPublishPath: dist/frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: BACKEND_HOST
        fromService:
          name: sarah-lineup-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME

databases:
  - name: sarah-lineup-db
    plan: free
    databaseName: okc
    user: okcapplicant
